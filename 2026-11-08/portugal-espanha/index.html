<!doctype html><meta charset=utf-8><link rel=stylesheet href=style.css><div id=root></div><style>.vs{display:flex;gap:24px;margin-top:40px}.vs .card{flex:1;margin-top:0;text-align:center}.vs .tag{display:inline-block;background:#FA581A;font-size:40px;font-weight:900;padding:6px 22px;border-radius:12px}.vs .cty{font-size:58px;font-weight:900;margin-top:22px}.vs .lng{font-size:42px;font-weight:500;color:#D6D6DA;margin-top:10px}.pr .row span:first-child{color:#9a9aa2;text-decoration:line-through;text-decoration-thickness:4px}.pr .card{padding:30px 44px;margin-top:22px}.alt .card{background:#08080A;border-color:#08080A}.cp{display:flex;align-items:center;justify-content:space-between}.cp b{font-size:56px;font-weight:900}.cp small{font-size:38px;font-weight:700;color:#FF7A45}</style><script src=engine.js></script><script>

init([

{alt:1,html:`<h2 data-t>Uma campanha por país.</h2><div class="card" data-in=".3"><div class="cp"><b class="txt">Campanha PT</b><small class="txt" style="color:#FA581A">€ verba própria</small></div></div><div class="card" data-in=".5"><div class="cp"><b class="txt">Campanha ES</b><small class="txt" style="color:#FA581A">€ verba própria</small></div></div><div class="sub" data-t>Idioma e verba não se misturam.</div>`},

{html:`<div class="end">${LOGO}<h2 data-t>Quer revisar sua conta na Europa?</h2><div class="pill" data-in=".5">Comenta RAIO-X</div><div class="hand" data-in=".7">@ignit.agency</div></div>`}
]);</script>
